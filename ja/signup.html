<body>

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/ja">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="/img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="/img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>
  <div class="auth-wrap">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-card-logo" href="/ja">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="/img/logo-light.png" alt="InteractInk logo" width="28" height="28">
          <img class="logo-mark logo-mark-dark" src="/img/logo-dark.png" alt="InteractInk logo" width="28" height="28">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <h1 data-i18n="auth.signUp">新規登録</h1>
      <p class="auth-sub" data-i18n="auth.signUpSub">アカウントを作成しましょう — 1分もかかりません。</p>
      <div class="auth-body">
        <div class="errmsg" id="su-err" style="display:none;"></div>
        <form id="su-form" onsubmit="doSignUp(event)">
          <div class="auth-field">
            <label for="su-username" data-i18n="auth.username">ユーザー名</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
              <input type="text" id="su-username" required maxlength="20" autocomplete="username" placeholder="username">
            </div>
            <span class="auth-hint">3〜20文字: 英字、数字、アンダースコア。</span>
          </div>
          <div class="auth-field">
            <label for="su-email" data-i18n="auth.email">メールアドレス</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></span>
              <input type="email" id="su-email" required autocomplete="email" placeholder="you@example.com">
            </div>
          </div>
          <div class="auth-field">
            <label for="su-age" data-i18n="auth.age">年齢</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span>
              <input type="number" id="su-age" required min="13" max="120" step="1" inputmode="numeric" autocomplete="off" placeholder="18">
            </div>
            <span class="auth-hint" data-i18n="auth.ageHint">13〜120歳。</span>
          </div>
          <div class="auth-field">
            <label for="su-gender" data-i18n="auth.gender">性別</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
              <select id="su-gender" required>
                <option value="" disabled selected data-i18n="auth.genderSelect">選択してください…</option>
                <option value="male" data-i18n="auth.genderMale">男性</option>
                <option value="female" data-i18n="auth.genderFemale">女性</option>
                <option value="other" data-i18n="auth.genderOther">その他</option>
                <option value="not_specified" data-i18n="auth.genderNotSpecified">回答しない</option>
              </select>
            </div>
          </div>
          <div class="auth-field">
            <label for="su-password" data-i18n="auth.password">パスワード</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <input type="password" id="su-password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
              <button type="button" class="pw-toggle" aria-label="パスワードを表示" onclick="togglePwVis('su-password', this)">
                <svg class="eye-on" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
            <span class="auth-hint">8文字以上。</span>
          </div>
          <div id="su-captcha" class="captcha-card" style="display:none;">
            <div class="captcha-card-head">
              <span class="captcha-card-icon">
                <svg class="cci-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
                <svg class="cci-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
              </span>
              <span class="captcha-card-text">
                <span class="captcha-card-title">Quick security check</span>
                <span class="captcha-card-sub">Confirm you're human to continue</span>
              </span>
            </div>
            <div class="captcha-card-body"><div class="captcha-skeleton"></div></div>
          </div>
          <input type="submit" id="su-btn" class="auth-submit" value="新規登録" data-i18n-value="auth.signUp">
        </form>



        <div class="auth-switch" id="su-switch"><span data-i18n="auth.haveAccount">すでにアカウントをお持ちですか?</span> <a href="/ja/login" data-i18n="nav.logIn">ログイン</a></div>
        <div class="auth-legal" id="su-legal" data-i18n="auth.legal">登録することで、InteractInkの<a href="/ja/rules">ルール</a>に同意したものとみなされます。</div>
        <div class="auth-legal" style="margin-top:4px;"><a href="/signup">English</a> &mdash; <a href="/es/signup">Español</a> &mdash; <a href="/fr/signup">Français</a> &mdash; <a href="/de/signup">Deutsch</a> &mdash; <a href="/pt/signup">Português</a> &mdash; <a href="/ru/signup">Русский</a></div>
      </div>
    </div>
  </div>
  </div>
</div>

</html>
