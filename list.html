<body data-page="list">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed">
      <div class="sec-bar">
        <span>List</span>
        <a class="back" href="lists.html" aria-label="All Lists" title="All Lists">&larr;</a>
      </div>

      <h1 id="page-h1" class="sr-only">List</h1>

      <div id="list-hero">
        <div class="skel-hero">
          <div class="skel-avatar skel-avatar-sq"></div>
          <div class="skel-lines">
            <div class="skel-line w40"></div>
            <div class="skel-line w90"></div>
            <div class="skel-line w30"></div>
          </div>
          <div class="skel-pill sm"></div>
        </div>
      </div>

      <div id="board-hdr" style="display:none;">
        <div class="xtabs" id="list-tabs">
          <button class="xtab active" id="tab-posts" onclick="switchListTab('posts');return false;">Posts</button>
          <button class="xtab" id="tab-members" onclick="switchListTab('members');return false;">Members</button>
          <button class="xtab" id="tab-followers" onclick="switchListTab('followers');return false;">Followers</button>
        </div>
      </div>

      <div id="list-content"></div>
    </div>

    <div id="sidebar">
      <div class="xsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="side-search" placeholder="Search InteractInk">
      </div>
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="lists.html" aria-label="All Lists" title="All Lists">&larr;</a>]
        <br><span style="font-size:10px;color:var(--muted);">&copy; 2026 InteractInk &mdash; <a href="about.html">About</a> &mdash; <a href="contact.html">Contact</a> &mdash; <a href="privacy.html">Privacy</a> &mdash; <a href="terms.html">Terms</a></span>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-report">
  <div class="modal">
    <a class="modal-close" href="#" onclick="closeReport();return false;">&#10005;</a>
    <h2>Report Post</h2>
    <label>Reason</label>
    <select id="report-reason">
      <option value="illegal">Illegal content</option>
      <option value="spam">Spam</option>
      <option value="doxxing">Doxxing / personal info</option>
      <option value="harassment">Harassment</option>
      <option value="other">Other</option>
    </select>
    <label>Details (optional)</label>
    <textarea id="report-details" rows="3" maxlength="500"></textarea>
    <button class="modal-btn" onclick="submitReport()">Submit Report</button>
  </div>
</div>

<!-- QUOTE POST MODAL -->
<div class="modal-bg" id="modal-quote">
  <div class="modal" style="width:420px;">
    <a class="modal-close" href="#" onclick="closeQuoteModal();return false;">&#10005;</a>
    <h2>Quote Post</h2>
    <div class="errmsg" id="qm-err" style="display:none;margin:0 16px 8px;"></div>
    <div class="qm-body">
      <span class="pf-avatar" id="qm-avatar"></span>
      <textarea id="qm-body" maxlength="500" placeholder="Add a comment"></textarea>
    </div>
    <div class="qm-preview-wrap" id="qm-preview"></div>
    <div class="qm-foot"><span class="qm-count" id="qm-count">500</span></div>
    <div id="qm-captcha" class="captcha-card" style="display:none;margin:0 16px 10px;">
      <div class="captcha-card-head">
        <span class="captcha-card-icon">
          <svg class="cci-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
          <svg class="cci-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
        </span>
        <span class="captcha-card-text">
          <span class="captcha-card-title">Quick security check</span>
          <span class="captcha-card-sub">Confirm you're human to continue</span>
        </span>
      </div>
      <div class="captcha-card-body"><div class="captcha-skeleton"></div></div>
    </div>
    <button class="modal-btn" id="qm-btn" onclick="submitQuote()">Post</button>
  </div>
</div>

<script src="js/list.js?v=20260820" defer></script>
</body>
</html>
