<!-- Locked to the @marpe account only — see supabase/admin_panel.sql.
     This page has no real security of its own (it's just HTML/JS
     sitting in the browser); the actual lock is is_admin() in the
     database, which js/admin.js calls before showing anything below. -->

<meta name="googlebot" content="noindex, nofollow">

<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<meta name="theme-color" content="#1185FE">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);}var a=localStorage.getItem('oc-accent');if(a&&a!=="green")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>

<style>
  .adm-section { margin-bottom:28px; }
  .adm-section h2 { font-size:16px; margin:0 0 10px; }
  .adm-search { width:100%; box-sizing:border-box; padding:10px 14px; border-radius:999px; border:1px solid var(--border-input); background:var(--hover-bg); color:var(--ink); font-size:14px; margin-bottom:12px; }
  .adm-search:focus { outline:2px solid var(--maroon); }
  .adm-row { display:flex; align-items:center; gap:10px; padding:10px 8px; border-bottom:1px solid var(--line); }
  .adm-row-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .adm-row-name { font-weight:700; font-size:14px; }
  .adm-row-handle { color:var(--muted); font-weight:400; }
  .adm-row-dt { color:var(--muted); font-weight:400; }
  .adm-row-meta { color:var(--muted); font-size:12px; }
  .adm-post-row .adm-row-txt { gap:4px; }
  .adm-post-row.adm-row-deleted { opacity:.55; }
  .adm-post-body { color:var(--ink); text-decoration:none; font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .adm-post-body:hover { text-decoration:underline; }
  .adm-row-acts { display:flex; gap:6px; flex:none; }
  .adm-btn { border:1px solid var(--border-input); background:transparent; color:var(--ink); font-weight:700; font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .adm-btn:hover { background:var(--hover-bg); }
  .adm-btn-active { background:var(--ink); color:var(--bg); }
  .adm-btn-danger { color:var(--like); border-color:var(--like); }
  .adm-btn-danger.adm-btn-active { background:var(--like); color:#fff; }
  .adm-btn-primary { color:var(--maroon); border-color:var(--maroon); }
  .adm-btn-primary.adm-btn-active, .adm-btn-primary:hover { background:var(--maroon); color:#fff; }
  .adm-verify-select { border:1px solid var(--border-input); background:transparent; color:var(--ink); font-weight:700; font-size:12px; padding:5px 8px; border-radius:999px; cursor:pointer; }
  .adm-verify-select:focus { outline:2px solid var(--maroon); }
  .adm-tag { font-size:10px; font-weight:800; text-transform:uppercase; margin-left:6px; padding:2px 6px; border-radius:6px; background:var(--like); color:#fff; vertical-align:middle; }
  .adm-tag-banned { background:var(--like); }
  .adm-tag-open { background:var(--maroon); }
  .adm-tag-actioned { background:var(--muted); }
  .adm-tag-dismissed { background:var(--muted); opacity:.7; }
  #admin-gate { padding:40px 16px; text-align:center; color:var(--muted); }

  /* ── stats bar ── */
  #adm-stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .adm-stat { flex:1 1 100px; background:var(--hover-bg); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; text-align:center; }
  .adm-stat b { display:block; font-size:20px; line-height:1.2; color:var(--ink); }
  .adm-stat span { font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:.02em; }
  .adm-stat-warn b { color:var(--like); }

  /* ── tabs ── */
  .adm-tabs { display:flex; gap:4px; overflow-x:auto; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .adm-tab { position:relative; flex:none; background:none; border:none; color:var(--muted); font-weight:700; font-size:14px; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  .adm-tab:hover { color:var(--ink); background:var(--hover-bg); }
  .adm-tab.active { color:var(--maroon); border-bottom-color:var(--maroon); }
  .adm-tab-badge { display:none; margin-left:6px; background:var(--like); color:#fff; font-size:10px; font-weight:800; border-radius:999px; padding:1px 6px; vertical-align:middle; }
  .adm-panel { display:none; }
  .adm-panel.active { display:block; }

  /* ── show-deleted toggle ── */
  .adm-showdel { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin:-4px 0 12px; cursor:pointer; user-select:none; }
  .adm-showdel input { margin:0; }

  /* ── reports filter row ── */
  .adm-report-filters { display:flex; gap:6px; margin-bottom:12px; }

  .no-t { padding:16px 8px; text-align:center; color:var(--muted); font-size:13px; }

  /* ── suspend modal (reuses .modal/.modal-bg shell) ── */
  .adm-suspend-actions { display:flex; gap:10px; padding:4px 16px 0; }
  .adm-suspend-actions .dc-btn { flex:1; }
</style>
</head>
<body data-page="admin">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed" style="max-width:640px;">
      <div class="sec-bar"><h1 class="sr-only">Admin</h1>Admin</div>

      <div id="admin-gate">Checking access&hellip;</div>

      <div id="admin-panel" style="display:none; padding:16px;">
        <div id="adm-stats"></div>

        <div class="adm-tabs" role="tablist">
          <button class="adm-tab active" data-tab="users" onclick="switchAdminTab('users')">Users</button>
          <button class="adm-tab" data-tab="posts" onclick="switchAdminTab('posts')">Posts</button>
          <button class="adm-tab" data-tab="replies" onclick="switchAdminTab('replies')">Replies</button>
          <button class="adm-tab" data-tab="articles" onclick="switchAdminTab('articles')">Articles</button>
          <button class="adm-tab" data-tab="reports" onclick="switchAdminTab('reports')">Reports<span class="adm-tab-badge" id="adm-reports-badge"></span></button>
        </div>

        <div class="adm-panel active" id="adm-panel-users">
          <div class="adm-section">
            <input class="adm-search" id="adm-user-q" placeholder="Search by username or display name&hellip;" autocomplete="off">
            <div id="adm-user-results"></div>
          </div>
        </div>

        <div class="adm-panel" id="adm-panel-posts">
          <div class="adm-section">
            <input class="adm-search" id="adm-post-q" placeholder="Search post text, or @username&hellip; (empty = most recent)" autocomplete="off">
            <label class="adm-showdel"><input type="checkbox" id="adm-post-showdel" onchange="togglePostShowDeleted()"> Show deleted</label>
            <div id="adm-post-results"></div>
          </div>
        </div>

        <div class="adm-panel" id="adm-panel-replies">
          <div class="adm-section">
            <input class="adm-search" id="adm-reply-q" placeholder="Search reply text, or @username&hellip; (empty = most recent)" autocomplete="off">
            <label class="adm-showdel"><input type="checkbox" id="adm-reply-showdel" onchange="toggleReplyShowDeleted()"> Show deleted</label>
            <div id="adm-reply-results"></div>
          </div>
        </div>

        <div class="adm-panel" id="adm-panel-articles">
          <div class="adm-section">
            <input class="adm-search" id="adm-article-q" placeholder="Search title/body, or @username&hellip; (empty = most recent)" autocomplete="off">
            <label class="adm-showdel"><input type="checkbox" id="adm-article-showdel" onchange="toggleArticleShowDeleted()"> Show deleted</label>
            <div id="adm-article-results"></div>
          </div>
        </div>

        <div class="adm-panel" id="adm-panel-reports">
          <div class="adm-section">
            <div class="adm-report-filters" id="adm-report-filters">
              <button class="adm-btn adm-btn-active" data-status="open" onclick="setReportFilter('open')">Open</button>
              <button class="adm-btn" data-status="actioned" onclick="setReportFilter('actioned')">Actioned</button>
              <button class="adm-btn" data-status="dismissed" onclick="setReportFilter('dismissed')">Dismissed</button>
              <button class="adm-btn" data-status="all" onclick="setReportFilter('all')">All</button>
            </div>
            <div id="adm-report-results"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div id="ftr" style="padding:0;">
        [<a href="index.html">&larr; Back to Home</a>]
        <br><span style="font-size:10px;color:var(--muted);">&copy; 2026 InteractInk &mdash; <a href="about.html">About</a> &mdash; <a href="contact.html">Contact</a> &mdash; <a href="privacy.html">Privacy</a> &mdash; <a href="terms.html">Terms</a></span>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="adm-suspend-bg">
  <div class="modal" style="width:320px;">
    <a href="#" class="modal-close" onclick="closeSuspendModal();return false;" aria-label="Close">&times;</a>
    <h2 id="adm-suspend-title">Suspend @user?</h2>
    <label for="adm-suspend-duration">Duration</label>
    <select id="adm-suspend-duration">
      <option value="permanent">Permanent</option>
      <option value="1">1 day</option>
      <option value="3">3 days</option>
      <option value="7">7 days</option>
      <option value="30">30 days</option>
    </select>
    <label for="adm-suspend-reason">Reason (optional)</label>
    <textarea id="adm-suspend-reason" rows="3" maxlength="500" placeholder="Shown to the user, if you want them to know why&hellip;"></textarea>
    <div id="adm-suspend-ips" style="font-size:12px;color:var(--muted);margin:6px 2px 0;"></div>
    <div class="adm-suspend-actions">
      <button class="dc-btn dc-btn-cancel" onclick="closeSuspendModal()">Cancel</button>
      <button class="dc-btn dc-btn-delete" id="adm-suspend-confirm" onclick="confirmSuspend()">Suspend</button>
    </div>
  </div>
</div>

</body>
</html>
