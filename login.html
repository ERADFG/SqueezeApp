<h1>Welcome back</h1>
<p class="auth-sub">Sign in to continue to your account.</p>
<div class="auth-body">
<div class="errmsg" id="li-err" style="display:none;"></div>
<form id="li-form" onsubmit="doLogIn(event)">
<div class="auth-field">
<label data-i18n="auth.email" for="li-email">Email</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
<input autocomplete="email" id="li-email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div class="auth-field">
<label data-i18n="auth.password" for="li-password">Password</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><rect height="9" rx="2" width="14" x="5" y="11"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
<input autocomplete="current-password" id="li-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Show password" class="pw-toggle" onclick="togglePwVis('li-password', this)" type="button">
<svg class="eye-on" viewbox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg class="eye-off" viewbox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="M3 3l18 18"></path></svg>
</button>
</div>
<div class="auth-forgot"><a href="/help/managing-your-account/login-issues">Forgot password?</a></div>
</div>
<input class="auth-submit" id="li-btn" type="submit" value="Sign In"/>
</form>
<div class="auth-divider">or</div>
<button class="auth-social-full" onclick="doOAuth('google', this)" type="button">
<svg viewbox="0 0 24 24"><path d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82Z" fill="#4285F4"></path><path d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24Z" fill="#34A853"></path><path d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28v-3.1H1.27A12 12 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1Z" fill="#FBBC05"></path><path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.18 15.23 0 12 0 7.31 0 3.26 2.69 1.27 6.62l4 3.1C6.22 6.86 8.87 4.75 12 4.75Z" fill="#EA4335"></path></svg>
<span>Continue with Google</span>
</button>
