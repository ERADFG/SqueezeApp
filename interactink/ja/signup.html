<h1 data-i18n="auth.signUp">アカウントを作成</h1>
<p class="auth-sub" data-i18n="auth.signUpSub">アカウントを作成しましょう — 1分もかかりません。</p>
<div class="auth-body">
<div class="errmsg" id="su-err" style="display:none;"></div>
<form id="su-form" onsubmit="doSignUp(event)">
<div class="auth-field">
<label data-i18n="auth.username" for="su-username">ユーザー名</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
<input autocomplete="username" id="su-username" maxlength="20" placeholder="username" required="" type="text"/>
</div>
<span class="auth-hint">3〜20文字: 英字、数字、アンダースコア。</span>
</div>
<div class="auth-field">
<label data-i18n="auth.email" for="su-email">メールアドレス</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg></span>
<input autocomplete="email" id="su-email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div class="auth-field">
<label data-i18n="auth.age" for="su-age">年齢</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></span>
<input autocomplete="off" id="su-age" inputmode="numeric" max="120" min="13" placeholder="18" required="" step="1" type="number"/>
</div>
<span class="auth-hint" data-i18n="auth.ageHint">13〜120歳。</span>
</div>
<div class="auth-field">
<label data-i18n="auth.gender" for="su-gender">性別</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
<select id="su-gender" required="">
<option data-i18n="auth.genderSelect" disabled="" selected="" value="">選択してください…</option>
<option data-i18n="auth.genderMale" value="male">男性</option>
<option data-i18n="auth.genderFemale" value="female">女性</option>
<option data-i18n="auth.genderOther" value="other">その他</option>
<option data-i18n="auth.genderNotSpecified" value="not_specified">回答しない</option>
</select>
</div>
</div>
<div class="auth-field">
<label data-i18n="auth.password" for="su-password">パスワード</label>
<div class="auth-input-wrap">
<span class="auth-fi"><svg viewbox="0 0 24 24"><rect height="9" rx="2" width="14" x="5" y="11"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
<input autocomplete="new-password" id="su-password" minlength="8" placeholder="••••••••" required="" type="password"/>
<button aria-label="パスワードを表示" class="pw-toggle" onclick="togglePwVis('su-password', this)" type="button">
<svg class="eye-on" viewbox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg class="eye-off" viewbox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="M3 3l18 18"></path></svg>
</button>
</div>
<span class="auth-hint">8文字以上。</span>
</div>
<div class="captcha-card" id="su-captcha" style="display:none;">
<div class="captcha-card-head">
<span class="captcha-card-icon">
<svg class="cci-shield" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"></path><path d="m9 12 2 2 4-4"></path></svg>
<svg class="cci-check" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24"><path d="M5 12.5 9.5 17 19 7"></path></svg>
</span>
<span class="captcha-card-text">
<span class="captcha-card-title">Quick security check</span>
<span class="captcha-card-sub">Confirm you're human to continue</span>
</span>
</div>
<div class="captcha-card-body"><div class="captcha-skeleton"></div></div>
</div>
<input class="auth-submit" data-i18n-value="auth.signUp" id="su-btn" type="submit" value="アカウントを作成"/>
</form>
<div class="auth-switch" id="su-switch"><span data-i18n="auth.haveAccount">すでにアカウントをお持ちですか?</span> <a data-i18n="nav.logIn" href="/ja/login">ログイン</a></div>
<div class="auth-legal" data-i18n="auth.legal" id="su-legal">登録することで、InteractInkの<a href="/ja/rules">ルール</a>に同意したものとみなされます。</div>

</div>
