<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/pt">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="/img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="/img/logo-dark.png" alt="InteractInk logo" width="36" height="36">

        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>
  <div class="auth-wrap">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-card-logo" href="/pt">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="/img/logo-light.png" alt="InteractInk logo" width="28" height="28">
          <img class="logo-mark logo-mark-dark" src="/img/logo-dark.png" alt="InteractInk logo" width="28" height="28">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <h1 data-i18n="auth.logIn">Entrar</h1>
      <p class="auth-sub" data-i18n="auth.logInSub">Que bom te ver de novo.</p>
      <div class="auth-body">
        <div class="errmsg" id="li-err" style="display:none;"></div>
        <form id="li-form" onsubmit="doLogIn(event)">
          <div class="auth-field">
            <label for="li-email" data-i18n="auth.email">E-mail</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></span>
              <input type="email" id="li-email" required autocomplete="email" placeholder="voce@exemplo.com">
            </div>
          </div>
          <div class="auth-field">
            <label for="li-password" data-i18n="auth.password">Senha</label>
            <div class="auth-input-wrap">
              <span class="auth-fi"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
              <input type="password" id="li-password" required autocomplete="current-password" placeholder="••••••••">
              <button type="button" class="pw-toggle" aria-label="Mostrar senha" onclick="togglePwVis('li-password', this)">
                <svg class="eye-on" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
              </button>
            </div>
          </div>
          <div id="li-captcha" class="captcha-card" style="display:none;">
            <div class="captcha-card-head">
              <span class="captcha-card-icon">
                <svg class="cci-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
                <svg class="cci-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
              </span>
              <span class="captcha-card-text">
                <span class="captcha-card-title">Quick security check</span>
                <span class="captcha-card-sub">Confirm you're human to continue</span>
              </span>
            </div>
            <div class="captcha-card-body"><div class="captcha-skeleton"></div></div>
          </div>
          <input type="submit" id="li-btn" class="auth-submit" value="Entrar" data-i18n-value="auth.logIn">
        </form>
        <div class="auth-switch"><span data-i18n="auth.noAccount">Ainda não tem conta?</span> <a href="/pt/signup" data-i18n="nav.signUp">Cadastrar-se</a></div>
        <div class="auth-legal" data-i18n="auth.legal">Ao continuar você concorda com as <a href="/pt/rules">regras</a> do InteractInk.</div>
        <div class="auth-legal" style="margin-top:4px;"><a href="/login">English</a> &mdash; <a href="/es/login">Español</a> &mdash; <a href="/fr/login">Français</a> &mdash; <a href="/de/login">Deutsch</a></div>
