<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="Write or edit a long-form article on InteractInk.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="InteractInk">

<meta property="og:description" content="Write or edit a long-form article on InteractInk.">
<meta property="og:image" content="/img/logo-light.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Write an Article — InteractInk">
<meta name="twitter:description" content="Write or edit a long-form article on InteractInk.">

<meta name="robots" content="noindex, nofollow">
<base href="/">
<link rel="icon" type="image/png" href="img/favicon-32.png" sizes="32x32" id="fav32">
<link rel="icon" type="image/png" href="img/favicon.png" sizes="512x512" id="fav512">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#1185FE">
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t&&t!=="light"){document.documentElement.setAttribute('data-theme',t);var f32=document.getElementById('fav32'),f512=document.getElementById('fav512');if(f32)f32.setAttribute('href',f32.getAttribute('href').replace('favicon-32.png','favicon-dark-32.png'));if(f512)f512.setAttribute('href',f512.getAttribute('href').replace('favicon.png','favicon-dark.png'));}var a=localStorage.getItem('oc-accent');if(a&&a!=="blue")document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>

</head>
<body data-page="editarticle">

<div class="xshell">
  <div id="hdr">
    <div class="sb-top">
      <a class="logo" href="/">
        <span class="badge">
          <img class="logo-mark logo-mark-light" src="img/logo-light.png" alt="InteractInk logo" width="36" height="36">
          <img class="logo-mark logo-mark-dark" src="img/logo-dark.png" alt="InteractInk logo" width="36" height="36">
        </span>
        <span class="wordmark">Interact<em>Ink</em></span>
      </a>
      <nav id="side-nav"></nav>
    </div>
    <span id="auth-area" class="auth-area"></span>
  </div>

  <div id="main">
    <div id="feed" style="max-width:680px;">
      <div class="sec-bar" id="ea-hdr">
        <a class="ep-back" href="articles.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>
        <div>
          <h1 id="ea-title-hdr">Write an Article</h1>
        </div>
      </div>

      <div id="editarticle-root">
        <div class="errmsg" id="ea-err" style="display:none;margin:12px 16px 0;"></div>
        <div class="ea-field">
          <label for="ea-title">Title</label>
          <input type="text" id="ea-title" maxlength="120" placeholder="Give your article a title">
        </div>
        <div class="ea-field">
          <label for="ea-cover">Cover image (optional)</label>
          <div class="ea-cover-row">
            <input type="text" id="ea-cover" maxlength="500" placeholder="https://… or upload one">
            <button type="button" class="ea-cover-upload-btn" onclick="document.getElementById('ea-cover-file').click()">Upload</button>
          </div>
          <input type="file" id="ea-cover-file" accept="image/*" style="display:none;">
        </div>
        <div class="ea-field">
          <label>Article</label>
          <div class="ea-toolbar" id="ea-toolbar">
            <button type="button" class="ea-tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
            <button type="button" class="ea-tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
            <button type="button" class="ea-tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
            <span class="ea-tb-sep"></span>
            <button type="button" class="ea-tb-btn" data-cmd="h2" title="Heading">H2</button>
            <button type="button" class="ea-tb-btn" data-cmd="h3" title="Subheading">H3</button>
            <button type="button" class="ea-tb-btn" data-cmd="quote" title="Quote">
              <svg viewBox="0 0 24 24"><path d="M7 7h4v6H8c0 2.2-1 3.5-3 4v-2c1 0 2-1 2-2V7Zm9 0h4v6h-3c0 2.2-1 3.5-3 4v-2c1 0 2-1 2-2V7Z"/></svg>
            </button>
            <span class="ea-tb-sep"></span>
            <button type="button" class="ea-tb-btn" data-cmd="ul" title="Bullet list">
              <svg viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
            </button>
            <button type="button" class="ea-tb-btn" data-cmd="ol" title="Numbered list">
              <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><text x="1" y="8" font-size="7" fill="currentColor" stroke="none">1</text><text x="1" y="14" font-size="7" fill="currentColor" stroke="none">2</text><text x="1" y="20" font-size="7" fill="currentColor" stroke="none">3</text></svg>
            </button>
            <span class="ea-tb-sep"></span>
            <button type="button" class="ea-tb-btn" data-cmd="link" title="Link">
              <svg viewBox="0 0 24 24"><path d="M9 15 15 9M11 6l1.5-1.5a3.5 3.5 0 0 1 5 5L16 11M13 18l-1.5 1.5a3.5 3.5 0 0 1-5-5L8 13"/></svg>
            </button>
            <button type="button" class="ea-tb-btn" data-cmd="image" title="Insert image anywhere">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" stroke="none"/><path d="m21 16-5.5-5.5a1 1 0 0 0-1.4 0L6 19"/></svg>
            </button>
            <input type="file" id="ea-body-img-file" accept="image/*" style="display:none;">
          </div>
          <div id="ea-editor" class="ea-editor" contenteditable="true" data-placeholder="Write your article here… select text to make it bold, or use the toolbar to drop in an image anywhere."></div>
        </div>
        <div class="ea-field ea-share-field" id="ea-share-wrap">
          <label class="ea-check"><input type="checkbox" id="ea-share" checked> Share this Article as a post</label>
          <textarea id="ea-share-body" maxlength="250" placeholder="Say something about it (optional)"></textarea>
        </div>
        <div class="ea-field" id="ea-captcha-wrap">
          <div id="ea-captcha" class="captcha-card" style="display:none;">
            <div class="captcha-card-head">
              <span class="captcha-card-icon">
                <svg class="cci-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
                <svg class="cci-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 9.5 17 19 7"/></svg>
              </span>
              <span class="captcha-card-text">
                <span class="captcha-card-title">Quick security check</span>
                <span class="captcha-card-sub">Confirm you're human to continue</span>
              </span>
            </div>
            <div class="captcha-card-body"><div class="captcha-skeleton"></div></div>
          </div>
        </div>
        <div class="ea-actions">
          <button type="button" class="modal-btn" id="ea-submit" onclick="submitArticle()">Publish</button>
        </div>
      </div>
    </div>

    <div id="sidebar">
      <div class="who-box" id="who-to-follow"></div>
      <div id="ftr" style="padding:0;">
        [<a href="articles.html" aria-label="All Articles" title="All Articles">&larr;</a>]

      </div>
    </div>
  </div>
</div>

</html>
