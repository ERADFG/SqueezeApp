name: Auto Blog Generator

# Runs on GitHub's servers on a schedule — completely independent of your
# computer. Your PC can be off, VS Code can be closed, doesn't matter.
#
# CADENCE: every 5 minutes — GitHub's scheduler's minimum interval (1-minute
# schedules aren't supported). Note it's "best effort": during busy periods
# a run can slip by a few minutes, so treat "every 5 min" as approximate.
# Each run costs one keyword-planning call + one writing call + one image
# lookup against your Groq key, so at this cadence you'll burn through
# quota fast — keep an eye on https://console.groq.com/settings/limits if
# runs start failing.
#
# SETUP (one-time):
#   1. Push this repo (including auto_blog.py and this .github/workflows
#      folder) to GitHub.
#   2. In the GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret
#        Name:  GROQ_API_KEY
#        Value: your Groq key from https://console.groq.com/keys
#   3. That's it. It'll start running automatically on the schedule below.
#      You can also trigger it manually any time from the Actions tab
#      ("Run workflow" button) to test it immediately.
#
# Every run: generates one post (with a hero image sourced from
# Openverse — no extra key needed for that part) and commits
# blogs/*.html + blog.html + blogs/manifest.json + blogs/index.html back
# into the repo. If your repo is connected to Vercel, that push triggers
# an automatic deploy, so new posts go live without you doing anything.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write

concurrency:
  group: auto-blog-generator
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate one blog post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python auto_blog.py --once

      - name: Commit and push new post
        run: |
          git config user.name "auto-blog-bot"
          git config user.email "auto-blog-bot@users.noreply.github.com"
          git add -A blogs blog.html
          if git diff --cached --quiet; then
            echo "No changes to commit (generation likely failed this run) — skipping."
          else
            git commit -m "Auto blog: new post $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi