name: Pinterest bot

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch: {}      # lets you press "Run workflow" by hand

permissions:
  contents: write            # needed to save the bot's state to the bot-data branch

concurrency:
  group: pinbot              # never two runs at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinterest-bot
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load saved state
        run: |
          if git ls-remote --exit-code --heads origin bot-data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch bot-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
          else
            mkdir data
          fi

      - name: Post a batch of pins
        run: node server.js
        env:
          RUN_ONCE: '1'
          DATA_DIR: ./data
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PINTEREST_API_BASE: ${{ vars.PINTEREST_API_BASE || 'https://api-sandbox.pinterest.com/v5' }}
          SITE_URL: ${{ vars.SITE_URL }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          BATCH_MAX_POSTS: ${{ vars.BATCH_MAX_POSTS || '5' }}

      - name: Save state
        if: always()
        run: |
          cd data
          if [ ! -d .git ]; then
            git init -q -b bot-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          git config user.name "pinbot"
          git config user.email "pinbot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "state $(date -u +%FT%TZ)"
            git push -q origin HEAD:bot-data
          fi
